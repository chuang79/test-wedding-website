<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256">
  <defs>
    <filter id="linen" color-interpolation-filters="sRGB">
      <!--
        baseFrequency: high X (0.75) = tight horizontal warp threads
                       low  Y (0.18) = wider vertical weft spacing
        This asymmetry is what gives linen its directional character.
      -->
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.75 0.18"
        numOctaves="5"
        seed="8"
        stitchTiles="stitch"
        result="noise"
      />
      <feColorMatrix type="saturate" values="0" in="noise" result="gray" />
      <feComponentTransfer in="gray">
        <!-- Map noise to a warm linen thread colour rather than neutral gray -->
        <feFuncR type="linear" slope="0.55" intercept="0.38" />
        <feFuncG type="linear" slope="0.55" intercept="0.30" />
        <feFuncB type="linear" slope="0.55" intercept="0.20" />
        <feFuncA type="linear" slope="1" />
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="256" height="256" filter="url(#linen)" />
</svg>
